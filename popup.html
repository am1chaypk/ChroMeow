<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ChroMeow</title>
    <link rel="stylesheet" href="./src/popup/popup.css" />
  </head>
  <body>
    <main class="popup" id="app">
      <header class="bar">
        <img class="bar__logo" src="/icons/icon32.png" alt="" width="22" height="22" />
        <h1 class="bar__title">ChroMeow</h1>
        <button class="bar__lang" id="lang" type="button" data-i18n="language">עברית</button>
      </header>

      <section class="cats" id="cats" aria-live="polite"></section>

      <p class="note" id="note" hidden></p>

      <section class="shelf" id="shelf" aria-label="Play">
        <button class="toy" type="button" data-action="treat">
          <svg viewBox="0 0 32 32" aria-hidden="true"><ellipse cx="14" cy="17" rx="9" ry="6" fill="#C9803E" /><path d="M21 17l7-5v10z" fill="#C9803E" /><circle cx="10.5" cy="15.5" r="1.3" fill="#5B3A1E" /></svg>
          <span data-i18n="feed">Drop treat</span>
        </button>
        <button class="toy" type="button" data-action="laser">
          <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="10" fill="#FF3B3B" opacity=".18" /><circle cx="16" cy="16" r="5" fill="#FF3B3B" opacity=".45" /><circle cx="16" cy="16" r="2.2" fill="#FFF2F2" /></svg>
          <span data-i18n="laser">Laser pointer</span>
        </button>
        <button class="toy" type="button" data-action="ball">
          <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="17" r="9" fill="#D9435E" /><path d="M10 13c4 3 8 3 12 0M10 21c4-3 8-3 12 0" stroke="#FFE08A" stroke-width="2" fill="none" stroke-linecap="round" /></svg>
          <span data-i18n="ball">Toy ball</span>
        </button>
        <button class="toy" type="button" data-action="call">
          <svg viewBox="0 0 32 32" aria-hidden="true"><ellipse cx="16" cy="21" rx="6.5" ry="5.2" fill="#E58B88" /><circle cx="9" cy="13.5" r="2.6" fill="#E58B88" /><circle cx="13.5" cy="9.5" r="2.6" fill="#E58B88" /><circle cx="18.5" cy="9.5" r="2.6" fill="#E58B88" /><circle cx="23" cy="13.5" r="2.6" fill="#E58B88" /></svg>
          <span data-i18n="call">Call cats</span>
        </button>
      </section>

      <section class="rows">
        <label class="row">
          <span class="row__text">
            <span class="row__title" data-i18n="clickThrough">Click-through lock</span>
            <span class="row__sub" id="lockSub"></span>
          </span>
          <kbd class="row__kbd">Alt+Shift+C</kbd>
          <input class="switch" type="checkbox" id="lock" />
        </label>
        <label class="row">
          <span class="row__text">
            <span class="row__title" id="siteTitle" data-i18n="pauseSite">Pause on this site</span>
            <span class="row__sub" id="siteSub"></span>
          </span>
          <input class="switch" type="checkbox" id="site" />
        </label>
        <label class="row">
          <span class="row__text"><span class="row__title" data-i18n="sound">Sound</span></span>
          <input class="range" type="range" id="volume" min="0" max="1" step="0.05" aria-label="Volume" />
          <input class="switch" type="checkbox" id="sound" />
        </label>
        <label class="row">
          <span class="row__text"><span class="row__title" data-i18n="size">Cat size</span></span>
          <input class="range range--wide" type="range" id="scale" min="0.6" max="1.6" step="0.05" aria-label="Cat size" />
        </label>
        <label class="row">
          <span class="row__text"><span class="row__title" data-i18n="names">Name tags</span></span>
          <input class="switch" type="checkbox" id="names" />
        </label>
        <label class="row">
          <span class="row__text"><span class="row__title" data-i18n="calm">Calm mode</span></span>
          <input class="switch" type="checkbox" id="calm" />
        </label>
        <label class="row">
          <span class="row__text"><span class="row__title" id="globalTitle" data-i18n="pauseAll">Pause everywhere</span></span>
          <input class="switch" type="checkbox" id="global" />
        </label>
      </section>

      <footer class="foot">
        <button class="studio" type="button" id="studio" data-i18n="studio">Open Cat Studio</button>
        <p class="foot__privacy" data-i18n="privacy">Everything runs on this computer. No network, no tracking.</p>
      </footer>
    </main>
    <script type="module" src="./src/popup/PopupController.ts"></script>
  </body>
</html>
