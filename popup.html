<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ChroMeow</title>
    <link rel="stylesheet" href="./src/popup/popup.css" />
  </head>
  <body>
    <main class="popup" id="app">
      <header class="bar">
        <img class="bar__logo" src="/icons/icon32.png" alt="" width="22" height="22" />
        <h1 class="bar__title">ChroMeow</h1>
        <button class="bar__lang" id="lang" type="button" data-i18n="language">עברית</button>
      </header>

      <section class="cats" id="cats" aria-live="polite"></section>

      <p class="note" id="note" hidden></p>

      <section class="shelf" id="shelf" aria-label="Play">
        <button class="toy" type="button" data-action="treat">
          <svg viewBox="0 0 32 32" aria-hidden="true"><ellipse cx="14" cy="17" rx="9" ry="6" fill="#C9803E" /><path d="M21 17l7-5v10z" fill="#C9803E" /><circle cx="10.5" cy="15.5" r="1.3" fill="#5B3A1E" /></svg>
          <span data-i18n="feed">Drop treat</span>
        </button>
        <button class="toy" type="button" data-action="laser">
          <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="10" fill="#FF3B3B" opacity=".18" /><circle cx="16" cy="16" r="5" fill="#FF3B3B" opacity=".45" /><circle cx="16" cy="16" r="2.2" fill="#FFF2F2" /></svg>
          <span data-i18n="laser">Laser pointer</span>
        </button>
        <button class="toy" type="button" data-action="ball">
          <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="17" r="9" fill="#D9435E" /><path d="M10 13c4 3 8 3 12 0M10 21c4-3 8-3 12 0" stroke="#FFE08A" stroke-width="2" fill="none" stroke-linecap="round" /></svg>
          <span data-i18n="ball">Toy ball</span>
        </button>
        <button class="toy" type="button" data-action="feather_wand">
          <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M27 3L13 14" stroke="#5A4636" stroke-width="2.2" stroke-linecap="round" /><path d="M13 14c-2 4 1 7-1 10" stroke="#CDBF9F" stroke-width="1.2" fill="none" /><circle cx="12" cy="24" r="1.8" fill="#E2B13C" /><path d="M12 24c-5 1-7 4-8 6 3-1 6-2 8-6z" fill="#F2557A" /><path d="M12 24c-2 3-2 5-1 7 2-2 2-4 1-7z" fill="#3BA7D9" /></svg>
          <span data-i18n="toolWand">Feather Wand</span>
        </button>
        <button class="toy" type="button" data-action="mouse">
          <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M13 18c-4 0-7 2-9 1" stroke="#C79A9A" stroke-width="1.2" fill="none" stroke-linecap="round" /><path d="M27 18c-1-6-11-7-14-2-1 2 0 3 2 3h10c1.4 0 2.2-.4 2-1z" fill="#8F8B88" /><circle cx="19.5" cy="12.5" r="3" fill="#8E8A87" /><circle cx="19.6" cy="12.5" r="1.8" fill="#F1B6B9" /><circle cx="23" cy="15.2" r=".9" fill="#1E1A18" /><circle cx="27" cy="17.6" r="1" fill="#E58B98" /></svg>
          <span data-i18n="mouseToy">Toy mouse</span>
        </button>
        <button class="toy" type="button" data-action="call">
          <svg viewBox="0 0 32 32" aria-hidden="true"><ellipse cx="16" cy="21" rx="6.5" ry="5.2" fill="#E58B88" /><circle cx="9" cy="13.5" r="2.6" fill="#E58B88" /><circle cx="13.5" cy="9.5" r="2.6" fill="#E58B88" /><circle cx="18.5" cy="9.5" r="2.6" fill="#E58B88" /><circle cx="23" cy="13.5" r="2.6" fill="#E58B88" /></svg>
          <span data-i18n="call">Call cats</span>
        </button>
      </section>
      <p class="shelf__hint" data-i18n="playHint">Pick a toy, or right-click a cat for games. Grab the ball or the mouse right off the page.</p>

      <section class="quick" aria-label="Show on the page">
        <button class="chip" type="button" id="toggleStation" aria-pressed="true">
          <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M5 18h10a5 5 0 0 1-10 0z" fill="#B5603F" /><ellipse cx="10" cy="18" rx="5" ry="1.6" fill="#9A5A2C" /><path d="M17 18h10a5 5 0 0 1-10 0z" fill="#4A79A3" /><ellipse cx="22" cy="18" rx="5" ry="1.6" fill="#78AFD7" /><rect x="3" y="24" width="26" height="2.4" rx="1.2" fill="#839C89" /></svg>
          <span data-i18n="bowlsToggle">Bowls</span>
        </button>
        <button class="chip" type="button" id="toggleBeds" aria-pressed="true">
          <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M4 20c0-6 5-9 12-9s12 3 12 9z" fill="#C47A57" /><ellipse cx="16" cy="20" rx="10" ry="3" fill="#F4E7D6" /><rect x="4" y="20" width="24" height="6" rx="3" fill="#9C5638" /></svg>
          <span data-i18n="bedsToggle">Beds</span>
        </button>
        <button class="chip" type="button" id="toggleTower" aria-pressed="true">
          <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="5" y="27" width="22" height="3" rx="1.2" fill="#B07A4A" /><rect x="9" y="17" width="3" height="10" fill="#D9C08A" /><rect x="20" y="17" width="3" height="10" fill="#D9C08A" /><rect x="7" y="10" width="18" height="8" rx="2" fill="#6E9A97" /><path d="M13 18v-3a3 3 0 0 1 6 0v3z" fill="#3A2A22" /><rect x="14.5" y="4" width="3" height="6" fill="#D9C08A" /><rect x="9" y="2" width="14" height="3" rx="1.4" fill="#B07A4A" /></svg>
          <span data-i18n="towerToggle">Cat Tree Tower 🧗</span>
        </button>
        <button class="chip chip--clear" type="button" id="clearAll">
          <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M9 25l12-12 3 3-12 12H9z" fill="#B9A288" /><path d="M21 13l3-6 3 3-6 3z" fill="#7A6A58" /><path d="M6 27h20" stroke="#7A6A58" stroke-width="1.6" stroke-linecap="round" /></svg>
          <span data-i18n="clearAll">Clear all</span>
        </button>
      </section>

      <section class="station" id="station" aria-labelledby="stationTitle">
        <div class="station__head">
          <h2 class="station__title" id="stationTitle" data-i18n="station">Food &amp; water</h2>
          <span class="station__low" id="stationLow" hidden></span>
        </div>
        <div class="bowl bowl--food">
          <span class="bowl__label" id="foodLabel" data-i18n="food">Food</span>
          <span class="bowl__track" role="meter" aria-labelledby="foodLabel" aria-valuemin="0" aria-valuemax="100" id="foodMeter"><span class="bowl__fill" id="foodFill"></span></span>
          <span class="bowl__pct" id="foodPct"></span>
          <button class="bowl__btn" type="button" id="refillFood"><span data-i18n="refillFood">Refill food</span> <span aria-hidden="true">🍖</span></button>
        </div>
        <div class="bowl bowl--water">
          <span class="bowl__label" id="waterLabel" data-i18n="water">Water</span>
          <span class="bowl__track" role="meter" aria-labelledby="waterLabel" aria-valuemin="0" aria-valuemax="100" id="waterMeter"><span class="bowl__fill" id="waterFill"></span></span>
          <span class="bowl__pct" id="waterPct"></span>
          <button class="bowl__btn" type="button" id="refillWater"><span data-i18n="refillWater">Refill water</span> <span aria-hidden="true">💧</span></button>
        </div>
        <p class="station__hint" data-i18n="stationHint">Click a bowl on the page to refill it, drag the mat to move it.</p>
      </section>

      <section class="rows">
        <label class="row">
          <span class="row__text">
            <span class="row__title" data-i18n="clickThrough">Click-through lock</span>
            <span class="row__sub" id="lockSub"></span>
          </span>
          <kbd class="row__kbd">Alt+Shift+C</kbd>
          <input class="switch" type="checkbox" id="lock" />
        </label>
        <label class="row">
          <span class="row__text">
            <span class="row__title" id="siteTitle" data-i18n="pauseSite">Pause on this site</span>
            <span class="row__sub" id="siteSub"></span>
          </span>
          <input class="switch" type="checkbox" id="site" />
        </label>
        <label class="row">
          <span class="row__text"><span class="row__title" data-i18n="size">Cat size</span></span>
          <input class="range range--wide" type="range" id="scale" min="0.6" max="1.6" step="0.05" aria-label="Cat size" />
        </label>
        <label class="row">
          <span class="row__text"><span class="row__title" data-i18n="names">Name tags</span></span>
          <input class="switch" type="checkbox" id="names" />
        </label>
        <label class="row">
          <span class="row__text"><span class="row__title" id="idleTitle" data-i18n="idleCuddle">Cuddle up when I’m away</span></span>
          <select class="select" id="idle" aria-labelledby="idleTitle"></select>
        </label>
        <label class="row">
          <span class="row__text">
            <span class="row__title" id="roamTitle" data-i18n="roamTabs">Cats roam between tabs</span>
            <span class="row__sub" data-i18n="roamSub">Only one Alex and one Anna in the whole browser — now and then one goes visiting.</span>
          </span>
          <input class="switch" type="checkbox" id="roam" aria-labelledby="roamTitle" />
        </label>
        <label class="row">
          <span class="row__text"><span class="row__title" data-i18n="calm">Calm mode</span></span>
          <input class="switch" type="checkbox" id="calm" />
        </label>
        <label class="row">
          <span class="row__text"><span class="row__title" id="globalTitle" data-i18n="pauseAll">Pause everywhere</span></span>
          <input class="switch" type="checkbox" id="global" />
        </label>
      </section>

      <footer class="foot">
        <button class="studio" type="button" id="studio" data-i18n="studio">Open Cat Studio</button>
        <p class="foot__privacy" data-i18n="privacy">Everything runs on this computer. No network, no tracking.</p>
        <p class="foot__credit" data-i18n="credit">Made by APK</p>
      </footer>
    </main>
    <script type="module" src="./src/popup/PopupController.ts"></script>
  </body>
</html>
